plugins { id 'com.android.application' }
android {
 namespace 'io.gyrolab.app'
 compileSdk 35
 defaultConfig { applicationId 'io.gyrolab.x'; minSdk 28; targetSdk 35; versionCode 1; versionName '0.1.0' }
 sourceSets.main.java.srcDirs += ['../core/src/main/java', '../lab/src/main/java']
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 signingConfigs { debug { storeFile rootProject.file('development/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 buildTypes { release { minifyEnabled false } }
}
